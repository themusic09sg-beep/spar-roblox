<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SPAR Roblox</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Onest:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#ffffff; --surface:#f3f7f4; --ink:#12201a; --muted:#4a5c52;
  --green:#157804; --green-ink:#ffffff; --red:#ff0306; --tag:#ff0306; --tag-ink:#ffffff; --line:#c9d8cf;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#0d1511;--surface:#16211b;--ink:#eef4f0;--muted:#a2b5aa;--green:#1faa5e;--green-ink:#ffffff;--red:#ff4b57;--tag:#ff0306;--tag-ink:#ffffff;--line:#2a3a31}
}
:root[data-theme="dark"]{--bg:#0d1511;--surface:#16211b;--ink:#eef4f0;--muted:#a2b5aa;--green:#1faa5e;--green-ink:#ffffff;--red:#ff4b57;--tag:#ff0306;--tag-ink:#ffffff;--line:#2a3a31}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.55 "Onest",system-ui,sans-serif}
a{color:inherit}
:focus-visible{outline:3px solid var(--red);outline-offset:3px}
.wrap{max-width:1040px;margin:0 auto;padding:0 20px}
header{background:#fff;color:#12201a;border-bottom:5px solid var(--green)}
header .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-top:14px;padding-bottom:14px}
.brand{font:700 18px/1 "Unbounded",sans-serif;text-decoration:none;display:flex;align-items:center;gap:10px}
.brand img{display:block;height:44px;width:auto}
.brand i{display:inline-block;width:14px;height:14px;background:var(--red);border-radius:50%;box-shadow:0 0 0 2px #fff}
nav ul{list-style:none;margin:0;padding:0;display:flex;gap:6px;flex-wrap:wrap}
nav a{display:block;padding:8px 12px;border-radius:8px;text-decoration:none;font-weight:500;font-size:15px}
nav a:hover{background:var(--green);color:#fff}

.hero{padding:56px 0 40px}
.price{display:inline-block;background:var(--tag);color:var(--tag-ink);padding:22px 28px 24px;border-radius:6px 6px 6px 28px;transform:rotate(-1.5deg);box-shadow:0 0 0 4px var(--green)}
.price h1{margin:0;font:700 clamp(36px,9vw,84px)/1 "Unbounded",sans-serif;letter-spacing:-.02em}
.hero p.lead{font-size:clamp(19px,2.6vw,24px);max-width:34ch;margin:30px 0 0;font-weight:500}

.notice{margin:8px 0 48px;padding:18px 20px;background:var(--surface);border-left:6px solid var(--red);border-radius:4px;max-width:70ch}
.notice p{margin:0;color:var(--muted)}
.notice a{color:var(--ink);font-weight:600}

h2{font:700 clamp(22px,3.6vw,30px)/1.2 "Unbounded",sans-serif;margin:0 0 20px}
.aisles{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;margin-bottom:64px}
.aisle{display:flex;flex-direction:column;justify-content:space-between;min-height:150px;padding:20px;background:var(--green);color:var(--green-ink);border-radius:14px 14px 4px 4px;text-decoration:none;position:relative}
.aisle::before{content:"";position:absolute;top:-14px;left:50%;width:3px;height:14px;background:var(--green)}
.aisle strong{font:700 20px/1.2 "Unbounded",sans-serif}
.aisle span{font-size:15px;opacity:.9}
.aisle:hover{background:var(--ink);color:var(--bg)}
.aisle.alt{background:var(--red);color:#fff}
.aisle.alt:hover{background:var(--ink);color:var(--bg)}

footer{background:var(--green);color:#fff;border-top:5px solid var(--red);padding:28px 0 36px;font-size:14px}
footer p{margin:0 0 8px;max-width:75ch;opacity:.9}
@media (max-width:600px){.hero{padding-top:36px}.price{padding:16px 18px 18px}}
@media (prefers-reduced-motion:no-preference){.aisle{transition:background .15s,color .15s}}

.page{display:none}.page.on{display:block}
.hero.sub{padding:44px 0 24px}.hero.sub h1{font:700 clamp(28px,6vw,52px)/1.1 "Unbounded",sans-serif;margin:0;letter-spacing:-.02em}
.hero.sub .lead{margin-top:16px;max-width:44ch}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px;margin-bottom:56px}
.card{background:var(--surface);border-left:6px solid var(--green);border-radius:4px;padding:20px 22px}
.card h2{font-size:20px;margin:0 0 6px}.card p{margin:0 0 4px;color:var(--muted)}
.card.wide{margin-bottom:56px;max-width:640px}.card.wide .btn{margin-top:14px}
.btn{display:inline-block;background:var(--red);color:#fff;padding:12px 20px;border-radius:8px;font-weight:600;text-decoration:none}
.btn:hover{background:var(--ink);color:var(--bg)}
.contact{border-top:3px solid var(--green);padding:28px 0 56px}.contact p{margin:0 0 16px;color:var(--muted)}
.group{font-weight:600;margin:0 0 48px}
nav a[aria-current="page"]{background:var(--green);color:#fff}

.tools{display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:flex-end}
.lang{display:flex;border:2px solid var(--green);border-radius:8px;overflow:hidden}
.lang button{font:600 14px/1 "Onest",sans-serif;padding:8px 12px;border:0;background:#fff;color:#12201a;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--green);color:#fff}
.lang button:hover{background:var(--ink);color:var(--bg)}

.banner{margin:32px 0 28px;padding:36px 28px 32px;background:var(--green);color:#fff;border-radius:6px;border-bottom:8px solid var(--red)}
.banner h1{margin:0;font:700 clamp(28px,7.5vw,64px)/1.05 "Unbounded",sans-serif;letter-spacing:-.02em}
.banner p{margin:16px 0 0;font-size:clamp(18px,2.4vw,22px);font-weight:500;max-width:36ch}
nav a{white-space:nowrap}
@media (max-width:700px){header .wrap{flex-direction:column;align-items:flex-start}.tools{justify-content:flex-start}.banner{padding:28px 20px 24px}}
</style>
</head>

    if(!T[lang]["t_"+r])r=cur="home";
    document.querySelectorAll(".page").forEach(function(p){p.classList.toggle("on",p.dataset.page===r)});
    document.querySelectorAll("[data-nav]").forEach(function(a){if(a.dataset.nav===r)a.setAttribute("aria-current","page");else a.removeAttribute("aria-current")});
    document.title=r==="home"?T[lang].doc_home:"SPAR Roblox — "+T[lang]["t_"+r];
    return r;
  }
  function apply(){
    var d=T[lang];
    document.documentElement.lang=lang;
    document.querySelectorAll("[data-i]").forEach(function(el){el.innerHTML=d[el.dataset.i]});
    document.querySelectorAll("[data-label]").forEach(function(el){el.setAttribute("aria-label",d[el.dataset.label])});
    document.querySelectorAll("[data-lang]").forEach(function(b){b.setAttribute("aria-pressed",b.dataset.lang===lang)});
    route();
  }
  document.querySelectorAll("[data-lang]").forEach(function(b){b.addEventListener("click",function(){
    lang=b.dataset.lang;try{localStorage.setItem("spar-lang",lang)}catch(e){}apply();
  })});
  document.addEventListener("click",function(e){
    var a=e.target.closest&&e.target.closest('a[href^="#/"]');
    if(!a)return;
    e.preventDefault();
    cur=a.getAttribute("href").replace(/^#\/?/,"")||"home";
    try{history.replaceState(null,"","#/"+(cur==="home"?"":cur))}catch(err){}
    route();window.scrollTo(0,0);
  });
  window.addEventListener("hashchange",function(){cur=fromHash();route();window.scrollTo(0,0)});
  apply();
})();
</script>
</body>
</html>
